# CHART_PATH/tests/secret-chart-condition_test.yaml
# secretChart.enabled existed as a value long before the dependency carried a condition
suite: academyfive - secretChart condition
templates:
  - charts/secretChart/templates/shared-secret.yaml
tests:
  - it: renders the shared secret by default
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: cas-a5-api-shared-secret
