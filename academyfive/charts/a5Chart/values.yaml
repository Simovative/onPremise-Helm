# Default values for a5Chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
  domain: "a5.university.com"

envData:
  CAS_A5_API_SECRET_LOCATION: "/mnt/shared-secret-volume/sharedSecret"
  A5_BUCKET_NAME: "a5bucket"
  CAS_BUCKET_NAME: "casbucket"
  CAS_SERVICE_URL: "cas"
  S3_REGION: "eu-central-1"
  CAS_ASSETS_URL: ""
  ASSET_SOURCE: "academy"
  A5_FILESTORAGE_ENDPOINT_URL: ""
  CAS_FILE_STORAGE_LOCATION: ""
  A5_INFRASTRUCTURE_CONFIG: "/run/config"
  METRICS_SCRAPER_IP: ""
  TIDEWAYS_CONNECTION: "" #tcp://tideways:9135
  TIDEWAYS_API_KEY: ""
  A5_RABBITMQ_ENDPOINT_URL: ""
  A5_NESTED_PROXY_COUNT: "1"
  CSP_ENDPOINT_URL: ""
  REDIS_SESSION:
    ENDPOINT: "tcp://<YOUR_REDIS_CLUSTER>"
    IS_CLUSTER: 1
    AUTH: "no_auth"
  REDIS_CACHE:
    ENDPOINT: "tcp://<YOUR_REDIS_CLUSTER>"
    IS_CLUSTER: 1
    AUTH: "no_auth"
  N8N_URL: ""
  OAS_FILE_STORAGE_TYPE: ""
  OAS_FILE_STORAGE_LOCATION: ""
  OAS_BUCKET_NAME: ""
infrastructureData:
  database_type: "mysql"
  database_read_location: "mysql://<YOUR_READ_USER>:<PASSWORD>@<READER_END_POINT>/<databaseName>"
  database_write_location: "mysql://<YOUR_WRITE_USER>:<PASSWORD>@<WRITER_END_POINT>/<DATABASE_NAME>"
  file_storage_type: "s3"
  cas_file_storage_volume_claim_name: "cas-file-storage-volume"
  oas_file_storage_volume_claim_name: "oas-file-storage-volume"
  a5_file_storage_location: ""
  oas_a5_domain: ""
  services_domain: ""
  pdf_service_url: ""
  rabbitmq_secret_name: "a5-rabbitmq-user-pass"
  rabbitmq_n8n_secret_name: "a5-rabbitmq-n8n-user-pass"
  session_type: "redis"
  session_cluster: true
  cache_type: "redis"
  maintenance_mode: false
  aws_region: "eu-central-1"
  n8n_owner_credentials_secret_name: "n8n-owner-credentials"
  n8n_user_management_jwt_secret_name: "n8n-user-management-jwt-secret"
  # must match casChart, and secretChart while it creates the Secret
  cas_a5_api_secret_name: "cas-a5-api-shared-secret"
  # Take single credential-bearing fields of the config from a Secret instead of the plain value
  # above, and let the chart keep rendering the rest of the document. Read at install/upgrade
  # time; the plain value stays the fallback, and a missing Secret with no plain value fails the
  # render. Requires a real helm install/upgrade - helm template never reaches the cluster and
  # silently shows the fallback.
  # The last two override values that live in envData, not here - REDIS_CACHE.AUTH and
  # A5_FILESTORAGE_ENDPOINT_URL. The filestorage pair covers both halves of that value: the
  # config field and the AC5_FILESTORAGE_ENDPOINT_URL environment variable.
  database_read_location_secret_name: ""
  database_read_location_secret_key: ""
  database_write_location_secret_name: ""
  database_write_location_secret_key: ""
  cache_auth_secret_name: ""
  cache_auth_secret_key: ""
  filestorage_endpoint_url_secret_name: ""
  filestorage_endpoint_url_secret_key: ""
  # Credentials that reach the application as environment variables. Named here, rendered as a
  # secretKeyRef - the chart picks the variable name, you pick the Secret and the key, so an
  # existing Secret works as it is. Setting one drops the plain value from the ConfigMap.
  # A missing Secret or key stops the Pod from starting; that is deliberate.
  redis_session_auth_secret_name: ""
  redis_session_auth_secret_key: ""
  tideways_api_key_secret_name: ""
  tideways_api_key_secret_key: ""
  ca_cert_value_secret_name: ""
  ca_cert_value_secret_key: ""
migration:
  executeMigration: true
deployment:
  academyfiveReplicas: 1
  image: <YOUR_IMAGE_LOCATION>
  versionTag: V18.14.8
  serviceAccountName: default
  imagePullSecrets: "regcred"
  cpuLimits: 4096m
  cpuRequests: 2048m
  memoryLimits: 8G
  memoryRequests: 4G
  academyfiveAcademyLogs:
    cpuLimits: 250m
    cpuRequests: 10m
    memoryLimits: 256Mi
    memoryRequests: 100Mi
  academyfiveErrorLogs:
    cpuLimits: 250m
    cpuRequests: 10m
    memoryLimits: 256Mi
    memoryRequests: 100Mi
  academyfiveDataAccessLogs:
    cpuLimits: 250m
    cpuRequests: 10m
    memoryLimits: 256Mi
    memoryRequests: 100Mi
  cron:
    cpuLimits: 4096m
    cpuRequests: 2048m
    memoryLimits: 32G
    memoryRequests: 16G
academy_file_storage_volume:
  enabled: false
  name: "academy-file-storage-volume"
  storageClass: "-"
  size: 50Gi
logging:
  usePersistentVolume: false
  logSizeLimit: 500Mi
storage:
  storageClass: "-"
  size: 2Gi
autoscalerIntegration: "hpa"
autoscaler:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 40
  targetMemoryUtilizationPercentage: 60
  scaleDown:
    scaleDownStabilizationWindowSeconds: 120
    shortScaleDownPeriod: 30
    shortScaleDownPodAmount: 1
    longScaleDownPeriod: 300
    longScaleDownPeriodPodAmount: 3
  scaleUp:
    scaleUpStabilizationWindowSeconds: 0
    shortScaleUpPeriod: 10
    shortScaleUpPeriodPodPercent: 100
    longScaleUpPeriod: 120
    longScaleUpPeriodPodAmount: 5
service:
  type: ClusterIP
  port: 80

