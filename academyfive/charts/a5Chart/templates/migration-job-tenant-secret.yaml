{{- if .Values.migration.executeMigration }}
# infrastructure config for the migration job
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "a5Chart.migrationConfigSecretName" . }}
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
stringData:
{{- include "a5Chart.tenantConfig" . | nindent 2 }}
{{- end }}
