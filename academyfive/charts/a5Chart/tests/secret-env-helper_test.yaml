# CHART_PATH/tests/secret-env-helper_test.yaml
# a5Chart.secretEnvVar and a5Chart.externalSecretEnv from _secret-env.tpl. The academy pod, the
# cron pod and the migration job all include the same helper, so every reference is asserted on
# all three.
#
# The chart owns the environment variable name, the customer owns the Secret and the key - the
# tests use key names that differ from the variable names on purpose.
suite: a5Chart - Secret Env Helper
templates:
  - academy-pod.yaml
  - cron-pod.yaml
  - migration-job.yaml
  - academy-configmap.yaml # needed for checksum check
  - cron-configmap.yaml # needed for checksum check
tests:
  # no Secret named, no env var - the plain value stays in the configmap instead
  - it: should render no credential env var when nothing is referenced
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="REDIS_SESSION_AUTH")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="TIDEWAYS_API_KEY")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="CA_CERT_VALUE")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AC5_FILESTORAGE_ENDPOINT_URL")]

  - it: should reference the redis session auth secret in all three workloads
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      infrastructureData.redis_session_auth_secret_name: a5-redis
      infrastructureData.redis_session_auth_secret_key: session-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SESSION_AUTH
            valueFrom:
              secretKeyRef:
                name: a5-redis
                key: session-password

  - it: should reference the tideways api key secret in all three workloads
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      infrastructureData.tideways_api_key_secret_name: a5-tideways
      infrastructureData.tideways_api_key_secret_key: apiKey
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TIDEWAYS_API_KEY
            valueFrom:
              secretKeyRef:
                name: a5-tideways
                key: apiKey

  - it: should reference the ca cert secret in all three workloads
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      infrastructureData.ca_cert_value_secret_name: a5-ca
      global.ca_cert_file: /tmp/university-ca.crt
      infrastructureData.ca_cert_value_secret_key: ca.crt
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CA_CERT_VALUE
            valueFrom:
              secretKeyRef:
                name: a5-ca
                key: ca.crt

  # one pair drives the config field and this env var - migrating only one half would be a trap
  - it: should reference the filestorage endpoint url secret in all three workloads
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      envData.A5_FILESTORAGE_ENDPOINT_URL: "http://s3user:pw@seaweedfs:8333"
      infrastructureData.filestorage_endpoint_url_secret_name: a5-s3
      infrastructureData.filestorage_endpoint_url_secret_key: url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AC5_FILESTORAGE_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: a5-s3
                key: url

  # a missing Secret or a wrong key must stop the Pod instead of letting it boot without a
  # password, so none of these may grow an `optional: true`
  - it: should mark no credential reference optional
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      infrastructureData.redis_session_auth_secret_name: a5-redis
      infrastructureData.redis_session_auth_secret_key: session-password
      infrastructureData.tideways_api_key_secret_name: a5-tideways
      infrastructureData.tideways_api_key_secret_key: apiKey
      infrastructureData.ca_cert_value_secret_name: a5-ca
      global.ca_cert_file: /tmp/university-ca.crt
      infrastructureData.ca_cert_value_secret_key: ca.crt
      infrastructureData.filestorage_endpoint_url_secret_name: a5-s3
      infrastructureData.filestorage_endpoint_url_secret_key: url
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="REDIS_SESSION_AUTH")].valueFrom.secretKeyRef.optional
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="TIDEWAYS_API_KEY")].valueFrom.secretKeyRef.optional
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="CA_CERT_VALUE")].valueFrom.secretKeyRef.optional
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AC5_FILESTORAGE_ENDPOINT_URL")].valueFrom.secretKeyRef.optional

  # RabbitMQ and n8n are genuinely optional features and do carry optional - the full table of
  # those entries lives in the rabbitmq and n8n suites, this is the contrast to the four above
  - it: should keep the optional feature references optional
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="A5_RABBITMQ_PASSWORD")].valueFrom.secretKeyRef.optional
          value: true
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="N8N_OWNER_API_KEY")].valueFrom.secretKeyRef.optional
          value: true
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="N8N_USER_MANAGEMENT_JWT_SECRET")].valueFrom.secretKeyRef.optional
          value: true

  # references are independent: naming one Secret must not pull in the others
  - it: should render only the referenced credential env var
    templates:
      - academy-pod.yaml
    set:
      infrastructureData.ca_cert_value_secret_name: a5-ca
      global.ca_cert_file: /tmp/university-ca.crt
      infrastructureData.ca_cert_value_secret_key: ca.crt
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name=="CA_CERT_VALUE")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="REDIS_SESSION_AUTH")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="TIDEWAYS_API_KEY")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AC5_FILESTORAGE_ENDPOINT_URL")]

  # a key without a name is not a reference - render nothing rather than an empty secretKeyRef
  - it: should ignore a secret key without a secret name
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      infrastructureData.tideways_api_key_secret_key: apiKey
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="TIDEWAYS_API_KEY")]

  # helm aborts on the first template that hits the fail and attributes it to migration-job.yaml,
  # the only one of the three without a configmap checksum include - scope the assertions there
  - it: should fail when the redis session auth secret name has no key
    templates:
      - migration-job.yaml
    set:
      infrastructureData.redis_session_auth_secret_name: a5-redis
    asserts:
      - failedTemplate:
          errorMessage: 'redis_session_auth_secret_name is set to "a5-redis" but redis_session_auth_secret_key is empty'

  - it: should fail when the tideways api key secret name has no key
    templates:
      - migration-job.yaml
    set:
      infrastructureData.tideways_api_key_secret_name: a5-tideways
    asserts:
      - failedTemplate:
          errorMessage: 'tideways_api_key_secret_name is set to "a5-tideways" but tideways_api_key_secret_key is empty'

  - it: should fail when the ca cert secret name has no key
    templates:
      - migration-job.yaml
    set:
      infrastructureData.ca_cert_value_secret_name: a5-ca
      global.ca_cert_file: /tmp/university-ca.crt
    asserts:
      - failedTemplate:
          errorMessage: 'ca_cert_value_secret_name is set to "a5-ca" but ca_cert_value_secret_key is empty'

  # without CA_CERT_FILE the entrypoint skips the certificate, so the reference would do nothing
  - it: should fail when the ca cert secret is referenced without global.ca_cert_file
    templates:
      - migration-job.yaml
    set:
      infrastructureData.ca_cert_value_secret_name: a5-ca
      infrastructureData.ca_cert_value_secret_key: ca
    asserts:
      - failedTemplate:
          errorMessage: 'ca_cert_value_secret_name is set but global.ca_cert_file is empty - the container would ignore the certificate'

  - it: should fail when the filestorage endpoint url secret name has no key
    templates:
      - migration-job.yaml
    set:
      infrastructureData.filestorage_endpoint_url_secret_name: a5-s3
    asserts:
      - failedTemplate:
          errorMessage: 'filestorage_endpoint_url_secret_name is set to "a5-s3" but filestorage_endpoint_url_secret_key is empty'

  # the customer keeps their own Secret layout, the chart only names the variable
  - it: should use the default rabbitmq secret names
    templates:
      - academy-pod.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="A5_RABBITMQ_USERNAME")].valueFrom.secretKeyRef.name
          value: a5-rabbitmq-user-pass
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="A5_RABBITMQ_N8N_USERNAME")].valueFrom.secretKeyRef.name
          value: a5-rabbitmq-n8n-user-pass

  - it: should use custom rabbitmq and n8n secret names
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      infrastructureData.rabbitmq_secret_name: my-rabbitmq
      infrastructureData.rabbitmq_n8n_secret_name: my-rabbitmq-n8n
      infrastructureData.n8n_owner_credentials_secret_name: my-n8n-owner
      infrastructureData.n8n_user_management_jwt_secret_name: my-n8n-jwt
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="A5_RABBITMQ_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-rabbitmq
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="A5_RABBITMQ_N8N_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-rabbitmq-n8n
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="N8N_OWNER_PASSWORD")].valueFrom.secretKeyRef.name
          value: my-n8n-owner
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="N8N_USER_MANAGEMENT_JWT_SECRET")].valueFrom.secretKeyRef.name
          value: my-n8n-jwt

  # envFrom was replaced by named references - a secretRef here would be the old mechanism back
  - it: should never pull credentials in through envFrom
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      infrastructureData.redis_session_auth_secret_name: a5-redis
      infrastructureData.redis_session_auth_secret_key: session-password
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 1
      - notExists:
          path: spec.template.spec.containers[0].envFrom[?(@.secretRef)]
