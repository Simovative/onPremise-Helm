suite: a5Chart - Migration Job executeMigration
templates:
  - migration-job-tenant-secret.yaml
tests:
  - it: should run when executeMigration is enabled
    set:
      migration.executeMigration: true
    asserts:
      - isKind:
          of: Secret

  - it: should not run when executeMigration is disabled
    set:
      migration.executeMigration: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create the Secret under the name the migration job mounts
    asserts:
      - equal:
          path: metadata.name
          value: migration-tenant-config
