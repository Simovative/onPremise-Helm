# CHART_PATH/tests/academy-container-external-secrets_test.yaml
# the academy pod, the cron pod and the migration job share the same secret plumbing
suite: a5Chart - Academy Container External Secrets
templates:
  - academy-pod.yaml
  - cron-pod.yaml
  - migration-job.yaml
  - academy-configmap.yaml # needed for checksum check
  - cron-configmap.yaml # needed for checksum check
tests:
  - it: should only reference the configmap when no credential secret is configured
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 1
      - notExists:
          path: spec.template.spec.containers[0].envFrom[0].secretRef
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SESSION_AUTH

  # the chart owns the variable name, the customer owns the Secret and the key
  - it: should render a secretKeyRef in all three workloads
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      infrastructureData.redis_session_auth_secret_name: a5-redis
      infrastructureData.redis_session_auth_secret_key: session-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_SESSION_AUTH
            valueFrom:
              secretKeyRef:
                name: a5-redis
                key: session-password

  # a missing Secret must stop the Pod, so no optional here
  - it: should not mark credential references optional
    templates:
      - academy-pod.yaml
    set:
      infrastructureData.tideways_api_key_secret_name: a5-tideways
      infrastructureData.tideways_api_key_secret_key: apiKey
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TIDEWAYS_API_KEY
            valueFrom:
              secretKeyRef:
                name: a5-tideways
                key: apiKey
                optional: true

  - it: should drop the plain value from the configmap once a secret is referenced
    templates:
      - academy-configmap.yaml
    set:
      envData.REDIS_SESSION.AUTH: plaintext-password
      infrastructureData.redis_session_auth_secret_name: a5-redis
      infrastructureData.redis_session_auth_secret_key: session-password
    asserts:
      - notExists:
          path: data.REDIS_SESSION_AUTH

  - it: should keep the plain value in the configmap without a reference
    templates:
      - academy-configmap.yaml
    set:
      envData.REDIS_SESSION.AUTH: plaintext-password
    asserts:
      - equal:
          path: data.REDIS_SESSION_AUTH
          value: plaintext-password

  # helm aborts on the first template that hits the fail, so the error is attributed to
  # migration-job.yaml - scope the assertion there rather than to every workload
  - it: should fail when a credential secret name has no key
    templates:
      - migration-job.yaml
    set:
      infrastructureData.ca_cert_value_secret_name: a5-ca
      global.ca_cert_file: /tmp/university-ca.crt
    asserts:
      - failedTemplate:
          errorMessage: 'ca_cert_value_secret_name is set to "a5-ca" but ca_cert_value_secret_key is empty'

  # one pair covers the config field and the environment variable
  - it: should drive the filestorage endpoint url env var from the secret
    templates:
      - academy-pod.yaml
    set:
      envData.A5_FILESTORAGE_ENDPOINT_URL: "http://user:pass@seaweedfs:8333"
      infrastructureData.filestorage_endpoint_url_secret_name: a5-s3
      infrastructureData.filestorage_endpoint_url_secret_key: url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AC5_FILESTORAGE_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: a5-s3
                key: url

  - it: should drop the filestorage endpoint url from the configmap
    templates:
      - academy-configmap.yaml
    set:
      envData.A5_FILESTORAGE_ENDPOINT_URL: "http://user:pass@seaweedfs:8333"
      infrastructureData.filestorage_endpoint_url_secret_name: a5-s3
      infrastructureData.filestorage_endpoint_url_secret_key: url
    asserts:
      - notExists:
          path: data.AC5_FILESTORAGE_ENDPOINT_URL

  - it: should use the default image pull secret
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: regcred

  - it: should use a custom image pull secret
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      deployment.imagePullSecrets: my-registry-credentials
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-registry-credentials

  - it: should mount the default cas api shared secret
    templates:
      - academy-pod.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secret-volume
            secret:
              secretName: cas-a5-api-shared-secret

  - it: should mount an externally managed cas api shared secret
    templates:
      - academy-pod.yaml
    set:
      infrastructureData.cas_a5_api_secret_name: my-cas-a5-shared-secret
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secret-volume
            secret:
              secretName: my-cas-a5-shared-secret

  - it: should mount the chart-rendered infrastructure config by default
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: infrastructure-config-dir-volume
            secret:
              secretName: academy-infrastructure-config-dir

  - it: should mount the migration copy of the infrastructure config by default
    templates:
      - migration-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: infrastructure-config-dir-volume
            secret:
              secretName: migration-tenant-config

  - it: should omit imagePullSecrets when the name is empty
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
      - migration-job.yaml
    set:
      deployment.imagePullSecrets: ""
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  # pinned against the creating templates - a mount that drifts from the Secret fails here
  - it: should mount the infrastructure config secret the chart creates
    templates:
      - academy-pod.yaml
      - cron-pod.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: infrastructure-config-dir-volume
            secret:
              secretName: academy-infrastructure-config-dir

  - it: should mount the migration config secret the chart creates
    templates:
      - migration-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: infrastructure-config-dir-volume
            secret:
              secretName: migration-tenant-config
