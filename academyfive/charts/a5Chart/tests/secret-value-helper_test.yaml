# CHART_PATH/tests/secret-value-helper_test.yaml
# a5Chart.secretOrValue from _secret-value.tpl - the per-field credential references of the
# infrastructure config document. Both consumers of a5Chart.tenantConfig are covered here.
#
# helm-unittest never resolves `lookup`, so the "Secret found" branch cannot be reached from a
# test - only `helm upgrade --dry-run=server` gets there. What is testable is everything around
# it: the plain value, the fallback when the Secret is unreadable, and both error paths.
suite: a5Chart - Secret Value Helper
templates:
  - tenant-secret.yaml
  - migration-job-tenant-secret.yaml
tests:
  # no reference configured: the value stays in values.yaml
  - it: should take the plain value for every field when no reference is configured
    templates:
      - tenant-secret.yaml
    set:
      global.domain: "example.com"
      infrastructureData.database_read_location: "mysql://reader:pw@reader.example.com/a5"
      infrastructureData.database_write_location: "mysql://writer:pw@writer.example.com/a5"
      envData.REDIS_CACHE.AUTH: "cache-password"
      envData.A5_FILESTORAGE_ENDPOINT_URL: "http://s3user:pw@seaweedfs:8333"
    asserts:
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"database_read_location": "mysql://reader:pw@reader\.example\.com/a5"'
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"database_write_location": "mysql://writer:pw@writer\.example\.com/a5"'
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"auth": "cache-password"'
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"filestorage_endpoint_url": "http://s3user:pw@seaweedfs:8333"'

  # an unreadable Secret must not break the render - deliberately softer than the env-var refs
  - it: should fall back to the plain database read location when the secret cannot be read
    templates:
      - tenant-secret.yaml
    set:
      global.domain: "example.com"
      infrastructureData.database_read_location: "mysql://reader:pw@reader.example.com/a5"
      infrastructureData.database_read_location_secret_name: "a5-db-urls"
      infrastructureData.database_read_location_secret_key: "read"
    asserts:
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"database_read_location": "mysql://reader:pw@reader\.example\.com/a5"'

  # database_location mirrors database_write_location, so one reference has to move both
  - it: should fall back to the plain database write location for both json fields
    templates:
      - tenant-secret.yaml
    set:
      global.domain: "example.com"
      infrastructureData.database_write_location: "mysql://writer:pw@writer.example.com/a5"
      infrastructureData.database_write_location_secret_name: "a5-db-urls"
      infrastructureData.database_write_location_secret_key: "write"
    asserts:
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"database_location": "mysql://writer:pw@writer\.example\.com/a5"'
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"database_write_location": "mysql://writer:pw@writer\.example\.com/a5"'

  - it: should fall back to the plain cache auth when the secret cannot be read
    templates:
      - tenant-secret.yaml
    set:
      global.domain: "example.com"
      envData.REDIS_CACHE.AUTH: "cache-password"
      infrastructureData.cache_auth_secret_name: "a5-redis-cache"
      infrastructureData.cache_auth_secret_key: "password"
    asserts:
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"auth": "cache-password"'

  - it: should fall back to the plain filestorage endpoint url when the secret cannot be read
    templates:
      - tenant-secret.yaml
    set:
      global.domain: "example.com"
      envData.A5_FILESTORAGE_ENDPOINT_URL: "http://s3user:pw@seaweedfs:8333"
      infrastructureData.filestorage_endpoint_url_secret_name: "a5-s3"
      infrastructureData.filestorage_endpoint_url_secret_key: "url"
    asserts:
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"filestorage_endpoint_url": "http://s3user:pw@seaweedfs:8333"'

  # "no_auth" is the sentinel that drops the key entirely - a reference must not resurrect it
  - it: should keep omitting the cache auth key when the plain value is the no_auth sentinel
    templates:
      - tenant-secret.yaml
    set:
      global.domain: "example.com"
      envData.REDIS_CACHE.AUTH: "no_auth"
      infrastructureData.cache_auth_secret_name: "a5-redis-cache"
      infrastructureData.cache_auth_secret_key: "password"
    asserts:
      - notMatchRegex:
          path: stringData["example.com"]
          pattern: '"auth"'

  # an empty endpoint url drops the key, with or without a reference in play
  - it: should omit the filestorage endpoint url when neither secret nor plain value resolves
    templates:
      - tenant-secret.yaml
    set:
      global.domain: "example.com"
      envData.A5_FILESTORAGE_ENDPOINT_URL: ""
    asserts:
      - notMatchRegex:
          path: stringData["example.com"]
          pattern: '"filestorage_endpoint_url"'

  # one resolution feeds every document, so the alias hostname sees the same fallback
  - it: should resolve once and reuse the result for the olddomain document
    templates:
      - tenant-secret.yaml
    set:
      global.domain: "example.com"
      global.olddomain: "old.example.com"
      infrastructureData.database_read_location: "mysql://reader:pw@reader.example.com/a5"
      infrastructureData.database_read_location_secret_name: "a5-db-urls"
      infrastructureData.database_read_location_secret_key: "read"
    asserts:
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"database_read_location": "mysql://reader:pw@reader\.example\.com/a5"'
      - matchRegex:
          path: stringData["old.example.com"]
          pattern: '"database_read_location": "mysql://reader:pw@reader\.example\.com/a5"'

  # the migration job gets its own copy of the document and the same resolution
  - it: should apply the same resolution to the migration job copy
    templates:
      - migration-job-tenant-secret.yaml
    set:
      global.domain: "example.com"
      infrastructureData.database_write_location: "mysql://writer:pw@writer.example.com/a5"
      infrastructureData.database_write_location_secret_name: "a5-db-urls"
      infrastructureData.database_write_location_secret_key: "write"
      envData.REDIS_CACHE.AUTH: "cache-password"
      infrastructureData.cache_auth_secret_name: "a5-redis-cache"
      infrastructureData.cache_auth_secret_key: "password"
    asserts:
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"database_write_location": "mysql://writer:pw@writer\.example\.com/a5"'
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"auth": "cache-password"'

  # a name without a key cannot resolve - catch the typo instead of silently falling back
  - it: should fail when the database read location secret name has no key
    templates:
      - tenant-secret.yaml
    set:
      infrastructureData.database_read_location_secret_name: "a5-db-urls"
    asserts:
      - failedTemplate:
          errorMessage: 'database_read_location_secret_name is set to "a5-db-urls" but database_read_location_secret_key is empty'

  - it: should fail when the database write location secret name has no key
    templates:
      - tenant-secret.yaml
    set:
      infrastructureData.database_write_location_secret_name: "a5-db-urls"
    asserts:
      - failedTemplate:
          errorMessage: 'database_write_location_secret_name is set to "a5-db-urls" but database_write_location_secret_key is empty'

  - it: should fail when the cache auth secret name has no key
    templates:
      - tenant-secret.yaml
    set:
      infrastructureData.cache_auth_secret_name: "a5-redis-cache"
    asserts:
      - failedTemplate:
          errorMessage: 'cache_auth_secret_name is set to "a5-redis-cache" but cache_auth_secret_key is empty'

  - it: should fail when the filestorage endpoint url secret name has no key
    templates:
      - tenant-secret.yaml
    set:
      infrastructureData.filestorage_endpoint_url_secret_name: "a5-s3"
    asserts:
      - failedTemplate:
          errorMessage: 'filestorage_endpoint_url_secret_name is set to "a5-s3" but filestorage_endpoint_url_secret_key is empty'

  # nothing left to fall back to: an unreadable Secret plus an empty plain value is fatal
  - it: should fail when the database read location has neither secret nor plain value
    templates:
      - tenant-secret.yaml
    set:
      infrastructureData.database_read_location: ""
      infrastructureData.database_read_location_secret_name: "a5-db-urls"
      infrastructureData.database_read_location_secret_key: "read"
    asserts:
      - failedTemplate:
          errorMessage: 'database_read_location: Secret "a5-db-urls" has no key "read" and no plain value is set'

  - it: should fail when the database write location has neither secret nor plain value
    templates:
      - tenant-secret.yaml
    set:
      infrastructureData.database_write_location: ""
      infrastructureData.database_write_location_secret_name: "a5-db-urls"
      infrastructureData.database_write_location_secret_key: "write"
    asserts:
      - failedTemplate:
          errorMessage: 'database_write_location: Secret "a5-db-urls" has no key "write" and no plain value is set'

  - it: should fail when the cache auth has neither secret nor plain value
    templates:
      - tenant-secret.yaml
    set:
      envData.REDIS_CACHE.AUTH: ""
      infrastructureData.cache_auth_secret_name: "a5-redis-cache"
      infrastructureData.cache_auth_secret_key: "password"
    asserts:
      - failedTemplate:
          errorMessage: 'cache_auth: Secret "a5-redis-cache" has no key "password" and no plain value is set'

  - it: should fail when the filestorage endpoint url has neither secret nor plain value
    templates:
      - tenant-secret.yaml
    set:
      envData.A5_FILESTORAGE_ENDPOINT_URL: ""
      infrastructureData.filestorage_endpoint_url_secret_name: "a5-s3"
      infrastructureData.filestorage_endpoint_url_secret_key: "url"
    asserts:
      - failedTemplate:
          errorMessage: 'filestorage_endpoint_url: Secret "a5-s3" has no key "url" and no plain value is set'

  # a key without a name is inert - no reference, no error, just the plain value
  - it: should ignore a secret key without a secret name
    templates:
      - tenant-secret.yaml
    set:
      global.domain: "example.com"
      infrastructureData.database_read_location: "mysql://reader:pw@reader.example.com/a5"
      infrastructureData.database_read_location_secret_key: "read"
    asserts:
      - matchRegex:
          path: stringData["example.com"]
          pattern: '"database_read_location": "mysql://reader:pw@reader\.example\.com/a5"'
