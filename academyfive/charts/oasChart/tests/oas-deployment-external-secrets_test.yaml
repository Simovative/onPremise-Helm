# CHART_PATH/tests/oas-deployment-external-secrets_test.yaml
suite: oasChart - oas Deployment External Secrets
templates:
  - oas-deployment.yaml
tests:
  - it: should not define envFrom at all
    set:
      enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  # oasChart renders envData as an inline env list, and inline env beats envFrom - which is why
  # the reference replaces the entry instead of being appended next to it
  - it: should replace the plain envData entry with a secretKeyRef
    set:
      enabled: true
      deployment.envData.OAS_S3_ENDPOINT_URL: "http://user:pass@seaweedfs:8333"
      secret.s3_endpoint_url_secret_name: oas-s3
      secret.s3_endpoint_url_secret_key: url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAS_S3_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: oas-s3
                key: url
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAS_S3_ENDPOINT_URL
            value: "http://user:pass@seaweedfs:8333"

  - it: should keep the plain envData entry without a reference
    set:
      enabled: true
      deployment.envData.OAS_S3_ENDPOINT_URL: "http://user:pass@seaweedfs:8333"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAS_S3_ENDPOINT_URL
            value: "http://user:pass@seaweedfs:8333"

  - it: should fail when the secret name has no key
    set:
      enabled: true
      secret.s3_endpoint_url_secret_name: oas-s3
    asserts:
      - failedTemplate:
          errorMessage: 's3_endpoint_url_secret_name is set to "oas-s3" but s3_endpoint_url_secret_key is empty'
