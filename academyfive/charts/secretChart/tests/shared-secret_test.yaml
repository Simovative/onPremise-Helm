suite: secretChart - CAS Api shared secret creation
templates:
  - shared-secret.yaml
tests:
  - it: provides a base64-encoded secret
    set:
      data.sharedSecret: Test1234
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.sharedSecret
          value: VGVzdDEyMzQ=
  - it: sets correct secret name
    asserts:
      - equal:
          path: metadata.name
          value: cas-a5-api-shared-secret
  - it: honours an externally managed secret name
    set:
      secret.cas_a5_api_secret_name: my-cas-a5-shared-secret
    asserts:
      - equal:
          path: metadata.name
          value: my-cas-a5-shared-secret
